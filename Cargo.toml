[package]
name = "vxapo-driver"
version = "0.1.0"
edition = "2021"
description = "VxAPO audio processing driver (Windows APO DLL)"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
log = "0.4"
once_cell = "1"
thiserror = "2"

[dependencies.windows]
version = "=0.62.2"
features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Media_Audio_Apo",
    "Win32_Media_KernelStreaming",
]
default-features = false

[dependencies.windows-core]
version = "=0.62.2"

[dependencies.windows-implement]
version = "=0.60.2"

[dependencies.windows-interface]
version = "=0.59.3"


[features]
default = []
# AEC 接口预留（O4/v6.6）：3 个 AEC 接口 + IID 常量声明，不实现。
aec = []

[profile.release]
panic = "abort"        # 必须（O3）：RT 路径 panic 若 unwind 会跨 FFI 传播（UB）
codegen-units = 1      # 必须（O3）：内联/代码布局可预测，RT 抖动最小化
lto = true

[profile.dev]
panic = "unwind"
